<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18191c"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>

    <!-- Front document gradient -->
    <linearGradient id="blueDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#2997ff"/>
    </linearGradient>

    <!-- Flap gradient -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80c0ff"/>
      <stop offset="100%" stop-color="#b8ddff"/>
    </linearGradient>

    <!-- Glass border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#cardShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle glow inside -->
  <circle cx="256" cy="230" r="140" fill="#0071e3" opacity="0.15" filter="blur(40px)"/>

  <!-- Back Sheet (translucent glass) -->
  <g opacity="0.85">
    <rect x="130" y="116" width="180" height="252" rx="20" fill="#24262b" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="160" y="160" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="160" y="184" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="160" y="208" width="105" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  </g>

  <!-- Front Sheet (Vibrant Apple Blue with Folded Flap) -->
  <g filter="url(#docShadow)">
    <!-- Document Body with clipped top-right fold -->
    <path d="M 204 156
             L 326 156
             L 388 218
             L 388 380
             A 22 22 0 0 1 366 402
             L 204 402
             A 22 22 0 0 1 182 380
             L 182 178
             A 22 22 0 0 1 204 156 Z"
          fill="url(#blueDocGrad)"/>

    <!-- Document inner highlight border -->
    <path d="M 204 157
             L 325 157
             L 387 219
             L 387 380
             A 21 21 0 0 1 366 401
             L 204 401
             A 21 21 0 0 1 183 380
             L 183 178
             A 21 21 0 0 1 204 157 Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Folded Corner Flap -->
    <path d="M 326 156 L 326 218 L 388 218 Z" fill="url(#flapGrad)"/>
    <path d="M 326 156 L 388 218" stroke="#004da3" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Content Marks (Clean white rounded lines) -->
    <rect x="220" y="250" width="76" height="10" rx="5" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="220" y="280" width="128" height="10" rx="5" fill="#ffffff" fill-opacity="0.82"/>
    <rect x="220" y="310" width="128" height="10" rx="5" fill="#ffffff" fill-opacity="0.82"/>
    <rect x="220" y="340" width="94" height="10" rx="5" fill="#ffffff" fill-opacity="0.6"/>
  </g>
</svg>
