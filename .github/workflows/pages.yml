name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Siapkan file situs
        run: |
          # salin seluruh situs (beranda, folder alat, assets/, ikon) kecuali file repo
          mkdir _site
          rsync -a --exclude='.git*' --exclude='README.md' --exclude='_site' ./ _site/
          touch _site/.nojekyll
          # pastikan setiap halaman alat ikut ter-deploy
          for p in index.html kompres gabung pisah atur-halaman gambar-ke-pdf pdf-ke-gambar word-ke-pdf pdf-ke-word; do
            f="_site/$p"; [ -d "$f" ] && f="$f/index.html"
            test -f "$f" || { echo "Halaman hilang: $f"; exit 1; }
          done
          ls -R _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
